const testimonialTabs = [...testimonialCarousel.querySelectorAll('[role="tab"]')];
const testimonialCards = [...testimonialDeck.querySelectorAll(".testimonial-card")];
let testimonialIndex = 0;
let testimonialDrag = null;
let testimonialSuppressClick = false;

function t(key, values = {}) {
  const dictionary = translations[language];
  if (!Object.prototype.hasOwnProperty.call(dictionary, key)) throw new Error(`Missing ${language} translation: ${key}`);
  return Object.entries(values).reduce((text, [name, value]) => text.replaceAll(`{${name}}`, String(value)), dictionary[key]);
}

function updateTestimonialToggle() {
  const paused = testimonialCarousel.classList.contains("is-paused");
  const label = t(paused ? "testimonialResume" : "testimonialPause");
  testimonialToggle.setAttribute("aria-label", label);
  testimonialToggle.title = label;
  document.getElementById("testimonial-toggle-icon").setAttribute("d", paused ? "M8 5.5v13l10.5-6.5z" : "M9 5v14m6-14v14");
}

function showTestimonial(index, { focusTab = false, direction = 0, fling = true } = {}) {
  const count = testimonialCards.length;
  const next = (index + count) % count;
  const previous = testimonialIndex;
  if (next !== previous) {
    const forward = direction ? direction > 0 : (next - previous + count) % count <= count / 2;
    testimonialCards.forEach((card) => card.classList.remove("is-flinging-out", "is-flinging-in"));
    if (fling && !reducedMotion.matches) {
      void testimonialDeck.offsetWidth;
      if (forward) testimonialCards[previous].classList.add("is-flinging-out");
      else if (testimonialCards[next].dataset.pos === "3") testimonialCards[next].classList.add("is-flinging-in");
    }
    testimonialIndex = next;
    testimonialCards.forEach((card, cardIndex) => { card.dataset.pos = String((cardIndex - next + count) % count); });
  }
  testimonialTabs.forEach((tab, tabIndex) => {
    const active = tabIndex === testimonialIndex;
    tab.setAttribute("aria-selected", String(active));
    tab.tabIndex = active ? 0 : -1;
  });
  document.getElementById("testimonial-current").textContent = String(testimonialIndex + 1).padStart(2, "0");
  if (focusTab) testimonialTabs[testimonialIndex].focus();
}

testimonialTabs.forEach((tab, tabIndex) => {
  tab.addEventListener("click", () => showTestimonial(tabIndex));
  tab.addEventListener("keydown", (event) => {
    const steps = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (event.key in steps) {
      event.preventDefault();
      showTestimonial(tabIndex + steps[event.key], { focusTab: true, direction: steps[event.key] });
    }
    if (event.key === "Home" || event.key === "End") {
      event.preventDefault();
      showTestimonial(event.key === "Home" ? 0 : testimonialTabs.length - 1, { focusTab: true });
    }
  });
});
testimonialCarousel.querySelectorAll("[data-testimonial-step]").forEach((button) => {
  const step = Number(button.dataset.testimonialStep);
  button.addEventListener("click", () => showTestimonial(testimonialIndex + step, { direction: step }));
});
testimonialCards.forEach((card, cardIndex) => {
  card.addEventListener("click", () => {
    if (testimonialSuppressClick || card.dataset.pos === "0") return;
    showTestimonial(cardIndex);
  });
});
testimonialDeck.addEventListener("animationend", (event) => {
  if (event.animationName.startsWith("testimonial-fling")) event.target.classList.remove("is-flinging-out", "is-flinging-in");
});

testimonialDeck.addEventListener("pointerdown", (event) => {
  const card = event.target.closest(".testimonial-card");
  if (!card || card.dataset.pos !== "0" || event.button !== 0) return;
  testimonialDrag = { card, pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, dx: 0, active: false };
});
testimonialDeck.addEventListener("pointermove", (event) => {
  const drag = testimonialDrag;
  if (!drag || event.pointerId !== drag.pointerId) return;
  const dx = event.clientX - drag.startX;
  const dy = event.clientY - drag.startY;
  if (!drag.active) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) testimonialDrag = null;
    if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) return;
    drag.active = true;
    drag.card.setPointerCapture(drag.pointerId);
    drag.card.classList.remove("is-flinging-out", "is-flinging-in");
    drag.card.classList.add("is-dragging");
    testimonialCarousel.classList.add("is-dragging");
  }
  drag.dx = dx;
  drag.card.style.transform = `translate3d(${dx}px, ${Math.abs(dx) * 0.04}px, 0) rotate(${dx / 28}deg)`;
});
function endTestimonialDrag(event) {
  const drag = testimonialDrag;
  if (!drag || event.pointerId !== drag.pointerId) return;
  testimonialDrag = null;
  if (!drag.active) return;
  drag.card.classList.remove("is-dragging");
  drag.card.style.transform = "";
  testimonialCarousel.classList.remove("is-dragging");
  testimonialSuppressClick = true;
  setTimeout(() => { testimonialSuppressClick = false; }, 0);
  const threshold = Math.min(110, drag.card.offsetWidth * 0.18);
  if (drag.dx < -threshold) showTestimonial(testimonialIndex + 1, { direction: 1, fling: false });
  else if (drag.dx > threshold) showTestimonial(testimonialIndex - 1, { direction: -1, fling: false });
}
testimonialDeck.addEventListener("pointerup", endTestimonialDrag);
testimonialDeck.addEventListener("pointercancel", endTestimonialDrag);

testimonialCarousel.addEventListener("animationend", (event) => {
  if (event.animationName !== "testimonial-progress" || reducedMotion.matches) return;
  showTestimonial(testimonialIndex + 1, { direction: 1 });
});
testimonialCarousel.addEventListener("pointerenter", (event) => {
  if (event.pointerType === "mouse") testimonialCarousel.classList.add("is-hovered");
});
testimonialCarousel.addEventListener("pointerleave", () => testimonialCarousel.classList.remove("is-hovered"));
testimonialToggle.addEventListener("click", () => {
  testimonialCarousel.classList.toggle("is-paused");
  updateTestimonialToggle();
});
document.addEventListener("visibilitychange", () => {
  testimonialCarousel.classList.toggle("is-page-hidden", document.hidden);
});
testimonialCarousel.classList.toggle("is-page-hidden", document.hidden);

function translatePage() {
  document.documentElement.lang = language;
  document.title = t("pageTitle");
  document.querySelector('meta[name="description"]').content = t("description");
  document.querySelector('meta[property="og:title"]').content = t("pageTitle");
  document.querySelector('meta[property="og:description"]').content = t("ogDescription");
  document.querySelector('meta[property="og:image:alt"]').content = t("imageAlt");
  document.querySelector('meta[property="og:locale"]').content = language === "fr" ? "fr_FR" : "en_GB";
  document.querySelector('meta[name="twitter:title"]').content = t("pageTitle");
  document.querySelector('meta[name="twitter:description"]').content = t("ogDescription");
  document.querySelectorAll("[data-i18n]").forEach((element) => { element.textContent = t(element.dataset.i18n); });
  document.querySelectorAll("[data-i18n-aria]").forEach((element) => { element.setAttribute("aria-label", t(element.dataset.i18nAria)); });
  document.querySelectorAll("[data-language]").forEach((button) => { button.setAttribute("aria-pressed", String(button.dataset.language === language)); });
  document.querySelectorAll("[data-product-link]").forEach((link) => {
    const product = products[link.dataset.productLink];
    link.setAttribute("aria-label", t("openOfficial", { name: t(product.title) }));
  });
  document.querySelectorAll(".product-tile").forEach((tile) => {
    tile.setAttribute("aria-label", t("openOfficial", { name: t(products[tile.dataset.product].title) }));
  });
  if (selectedSlot) renderSelectedSlot();
  if (!document.getElementById("profile-error").hidden) document.getElementById("profile-error").textContent = t("requiredProfile");
  if (!document.getElementById("need-error").hidden) document.getElementById("need-error").textContent = t("requiredNeed");
  menuButton.setAttribute("aria-label", t(navigation.classList.contains("is-open") ? "menuCloseAria" : "menuOpenAria"));
  updateTestimonialToggle();
  renderDemoStep();
  if (productDialog.dataset.product) renderProductDialog(productDialog.dataset.product);
}

function setLanguage(nextLanguage) {
  if (!Object.prototype.hasOwnProperty.call(translations, nextLanguage)) throw new Error(`Unsupported language: ${nextLanguage}`);
  language = nextLanguage;
  translatePage();
}

document.querySelectorAll("[data-language]").forEach((button) => {
  button.addEventListener("click", () => setLanguage(button.dataset.language));
});

function closeMenu() {
  navigation.classList.remove("is-open");
  menuButton.setAttribute("aria-expanded", "false");
  menuButton.setAttribute("aria-label", t("menuOpenAria"));
}

menuButton.addEventListener("click", () => {
  const open = menuButton.getAttribute("aria-expanded") !== "true";
  navigation.classList.toggle("is-open", open);
  menuButton.setAttribute("aria-expanded", String(open));
  menuButton.setAttribute("aria-label", t(open ? "menuCloseAria" : "menuOpenAria"));
});
navigation.querySelectorAll("a").forEach((link) => link.addEventListener("click", closeMenu));
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && navigation.classList.contains("is-open")) {
    closeMenu();
    menuButton.focus();
  }
});

document.querySelectorAll("[data-demo]").forEach((button) => {
  button.addEventListener("click", () => {
    closeMenu();
    demoStep = 1;
    selectedSlot = null;
    demoDialog.querySelectorAll('input[name="profile"], input[name="need"]').forEach((input) => { input.checked = false; });
    demoDialog.querySelectorAll(".dialog-error").forEach((error) => { error.hidden = true; error.textContent = ""; });
    document.getElementById("demo-confirmation").hidden = true;
    document.getElementById("selected-slot").textContent = "";
    demoDialog.showModal();
    renderDemoStep();
    demoDialog.querySelector('input[name="profile"]').focus();
  });
});

document.querySelectorAll("[data-close-dialog]").forEach((button) => {
  button.addEventListener("click", () => button.closest("dialog").close());
});

document.querySelectorAll("[data-next]").forEach((button) => {
  button.addEventListener("click", () => {
    if (demoStep === 1 && !demoDialog.querySelector('input[name="profile"]:checked')) {
      const error = document.getElementById("profile-error");
      error.textContent = t("requiredProfile");
      error.hidden = false;
      demoDialog.querySelector('input[name="profile"]').focus();
      return;
    }
    if (demoStep === 2 && !demoDialog.querySelector('input[name="need"]:checked')) {
      const error = document.getElementById("need-error");
      error.textContent = t("requiredNeed");
      error.hidden = false;
      demoDialog.querySelector('input[name="need"]').focus();
      return;
    }
    demoStep = Number(button.dataset.next);
    renderDemoStep();
    if (demoStep === 2) demoDialog.querySelector('input[name="need"]').focus();
    if (demoStep === 3) document.querySelector("#slot-grid button")?.focus();
  });
});

document.querySelectorAll("[data-previous]").forEach((button) => {
  button.addEventListener("click", () => {
    demoStep = Number(button.dataset.previous);
    renderDemoStep();
    demoDialog.querySelector(demoStep === 1 ? 'input[name="profile"]' : 'input[name="need"]').focus();
  });
});

function upcomingWorkingDays() {
  const days = [];
  const day = new Date();
  day.setHours(12, 0, 0, 0);
  day.setDate(day.getDate() + 1);
  while (days.length < 3) {
    if (day.getDay() !== 0 && day.getDay() !== 6) days.push(new Date(day));
    day.setDate(day.getDate() + 1);
  }
  return days;
}

function formatSlotDate(day) {
  return new Intl.DateTimeFormat(translations[language].dateLocale, { weekday: "short", day: "numeric", month: "short" }).format(day);
}

function renderSelectedSlot() {
  const date = formatSlotDate(selectedSlot.day);
  document.getElementById("selected-slot").textContent = t("slotSelected", { date, time: selectedSlot.time });
}

function renderSlots() {
  const grid = document.getElementById("slot-grid");
  grid.replaceChildren();
  const times = [t("timeMorning"), t("timeMidday"), t("timeAfternoon")];
  upcomingWorkingDays().forEach((day) => {
    const date = formatSlotDate(day);
    times.forEach((time) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "slot-button";
      button.textContent = t("slotVisible", { date, time });
      button.setAttribute("aria-label", t("slotAria", { date, time }));
      button.addEventListener("click", () => {
        selectedSlot = { day: new Date(day), time };
        renderSelectedSlot();
        demoStep = 3;
        document.getElementById("demo-step-one").hidden = true;
        document.getElementById("demo-step-two").hidden = true;
        document.getElementById("demo-step-three").hidden = true;
        document.getElementById("demo-confirmation").hidden = false;
        document.getElementById("demo-step-indicator").textContent = t("step", { current: 3, total: 3 });
        document.querySelector("#demo-confirmation [data-close-dialog]").focus();
      });
      grid.append(button);
    });
  });
}

function renderDemoStep() {
  const finished = !document.getElementById("demo-confirmation").hidden;
  document.getElementById("demo-step-indicator").textContent = t("step", { current: demoStep, total: 3 });
  document.getElementById("demo-step-one").hidden = demoStep !== 1 || finished;
  document.getElementById("demo-step-two").hidden = demoStep !== 2 || finished;
  document.getElementById("demo-step-three").hidden = demoStep !== 3 || finished;
  if (demoStep === 3 && !finished) renderSlots();
}

function renderProductDialog(productId) {
  const product = products[productId];
  if (!product) throw new Error(`Unknown product: ${productId}`);
  productDialog.dataset.product = productId;
  document.getElementById("product-dialog-group").textContent = t(product.group);
  document.getElementById("product-dialog-title").textContent = t(product.title);
  document.getElementById("product-dialog-copy").textContent = t(product.copy);
  const status = document.getElementById("product-dialog-status");
  status.textContent = product.status ? t(product.status) : "";
  status.hidden = !product.status;
  const link = document.getElementById("product-dialog-link");
  link.href = product.href;
  document.getElementById("product-dialog-link-label").textContent = t("openOfficial", { name: t(product.title) });
}

function openProductDialog(article) {
  closeMenu();
  renderProductDialog(article.dataset.product);
  productDialog.showModal();
  document.getElementById("product-dialog-title").focus();
}

const productTiles = [...document.querySelectorAll(".product-tile")];
productTiles.forEach((tile) => {
  tile.setAttribute("aria-label", t("openOfficial", { name: t(products[tile.dataset.product].title) }));
  tile.addEventListener("click", (event) => {
    if (event.target.closest("a")) return;
    openProductDialog(tile);
  });
  tile.addEventListener("keydown", (event) => {
    if (event.target === tile && (event.key === "Enter" || event.key === " ")) {
      event.preventDefault();
      openProductDialog(tile);
    }
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) {
      event.preventDefault();
      moveTileFocus(tile, event.key);
    }
  });
  tile.addEventListener("pointermove", (event) => {
    if (reducedMotion.matches || event.pointerType !== "mouse") return;
    const rect = tile.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width;
    const y = (event.clientY - rect.top) / rect.height;
    tile.style.setProperty("--spot-x", `${x * 100}%`);
    tile.style.setProperty("--spot-y", `${y * 100}%`);
    tile.style.setProperty("--tilt-x", `${(0.5 - y) * 5}deg`);
    tile.style.setProperty("--tilt-y", `${(x - 0.5) * 5}deg`);
  });
  tile.addEventListener("pointerleave", () => {
    tile.style.setProperty("--tilt-x", "0deg");
    tile.style.setProperty("--tilt-y", "0deg");
  });
});

function moveTileFocus(current, direction) {
  const rect = current.getBoundingClientRect();
  const horizontal = direction === "ArrowLeft" || direction === "ArrowRight";
  const sign = direction === "ArrowRight" || direction === "ArrowDown" ? 1 : -1;
  const candidates = productTiles.filter((tile) => tile !== current).map((tile) => {
    const other = tile.getBoundingClientRect();
    const dx = other.left + other.width / 2 - (rect.left + rect.width / 2);
    const dy = other.top + other.height / 2 - (rect.top + rect.height / 2);
    const forward = sign * (horizontal ? dx : dy) > 0;
    const primary = Math.abs(horizontal ? dx : dy);
    const secondary = Math.abs(horizontal ? dy : dx);
    return { tile, forward, score: primary + secondary * 1.8 };
  });
  const directional = candidates.filter((candidate) => candidate.forward).sort((a, b) => a.score - b.score)[0];
  const fallback = (sign > 0 ? candidates : [...candidates].reverse())[0];
  (directional || fallback)?.tile.focus();
}

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && navigation.classList.contains("is-open")) closeMenu();
});

translatePage();
</script>
