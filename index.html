.binom-step { position: relative; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 8px; width: 100%; padding: 13px 16px 13px 18px; border: 0; border-radius: 0 12px 12px 0; background: none; text-align: start; transition: background-color 250ms ease, box-shadow 250ms ease; }
.binom-step:hover { background: #f0f4fa; }

@keyframes binom-progress { from { transform: scaleY(0); } to { transform: none; } }
.binom-demo { position: relative; padding: clamp(14px, 2.6vw, 28px); border-radius: 22px; background: #edf2f9; isolation: isolate; }
.binom-window { border-radius: 14px; }
.binom-body { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 380px; }

@keyframes write-in { from { clip-path: inset(0 100% 0 0); opacity: .3; } to { clip-path: inset(0 0 0 0); opacity: 1; } }
.binom-note-lines mark {

}
.binom-note-lines mark::after { position: relative; inset-block-start: -.55em; margin-inline-start: 2px; color: var(--blue); content: attr(data-field); font-size: 9px; font-weight: 700; opacity: 0; transition: opacity 300ms ease, color 200ms ease; }
.binom-demo:not([data-step="1"]) mark { background-size: 100% 100%; transition-delay: calc(var(--n) * 280ms), 0s; }

.binom-fields { display: grid; flex: 1; align-content: start; gap: 6px; margin: 0; padding: 0; list-style: none; }
.binom-field { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "label check" "value check"; align-items: center; column-gap: 10px; width: 100%; min-height: 52px; padding: 7px 12px; border: 1px solid #e6ecf3; border-radius: 10px; background: #fff; color: inherit; text-align: start; transition: border-color 200ms ease, background-color 200ms ease; }

function t(key, values = {}) {
  const dictionary = translations[language];
  if (!Object.prototype.hasOwnProperty.call(dictionary, key)) throw new Error(`Missing ${language} translation: ${key}`);
  return Object.entries(values).reduce((text, [name, value]) => text.replaceAll(`{${name}}`, String(value)), dictionary[key]);
}

function updateTestimonialToggle() {

}

function showTestimonial(index, { focusTab = false, direction = 0, fling = true } = {}) {
  const count = testimonialCards.length;
  const next = (index + count) % count;
  const previous = testimonialIndex;
  if (next !== previous) {
    const forward = direction ? direction > 0 : (next - previous + count) % count <= count / 2;
    testimonialCards.forEach((card) => card.classList.remove("is-flinging-out", "is-flinging-in"));
    if (fling && !reducedMotion.matches) {
      void testimonialDeck.offsetWidth;
      if (forward) testimonialCards[previous].classList.add("is-flinging-out");
      else if (testimonialCards[next].dataset.pos === "3") testimonialCards[next].classList.add("is-flinging-in");
    }
    testimonialIndex = next;
    testimonialCards.forEach((card, cardIndex) => { card.dataset.pos = String((cardIndex - next + count) % count); });
  }
  testimonialTabs.forEach((tab, tabIndex) => {
    const active = tabIndex === testimonialIndex;
    tab.setAttribute("aria-selected", String(active));
    tab.tabIndex = active ? 0 : -1;
  });
  document.getElementById("testimonial-current").textContent = String(testimonialIndex + 1).padStart(2, "0");
  if (focusTab) testimonialTabs[testimonialIndex].focus();
}

testimonialTabs.forEach((tab, tabIndex) => {

  tab.addEventListener("keydown", (event) => {
    const steps = { ArrowRight: 1, ArrowDown: 1, ArrowLeft: -1, ArrowUp: -1 };
    if (event.key in steps) {
      event.preventDefault();
      showTestimonial(tabIndex + steps[event.key], { focusTab: true, direction: steps[event.key] });
    }
    if (event.key === "Home" || event.key === "End") {
      event.preventDefault();
      showTestimonial(event.key === "Home" ? 0 : testimonialTabs.length - 1, { focusTab: true });
    }
  });
});

});

});

testimonialDeck.addEventListener("pointerdown", (event) => {
  const card = event.target.closest(".testimonial-card");
  if (!card || card.dataset.pos !== "0" || event.button !== 0) return;
  testimonialDrag = { card, pointerId: event.pointerId, startX: event.clientX, startY: event.clientY, dx: 0, active: false };
});
testimonialDeck.addEventListener("pointermove", (event) => {
  const drag = testimonialDrag;
  if (!drag || event.pointerId !== drag.pointerId) return;
  const dx = event.clientX - drag.startX;
  const dy = event.clientY - drag.startY;
  if (!drag.active) {
    if (Math.abs(dy) > 12 && Math.abs(dy) > Math.abs(dx)) testimonialDrag = null;
    if (Math.abs(dx) < 8 || Math.abs(dx) < Math.abs(dy)) return;
    drag.active = true;
    drag.card.setPointerCapture(drag.pointerId);
    drag.card.classList.remove("is-flinging-out", "is-flinging-in");
    drag.card.classList.add("is-dragging");
    testimonialCarousel.classList.add("is-dragging");
  }
  drag.dx = dx;
  drag.card.style.transform = `translate3d(${dx}px, ${Math.abs(dx) * 0.04}px, 0) rotate(${dx / 28}deg)`;
});
function endTestimonialDrag(event) {
  const drag = testimonialDrag;
  if (!drag || event.pointerId !== drag.pointerId) return;
  testimonialDrag = null;
  if (!drag.active) return;
  drag.card.classList.remove("is-dragging");
  drag.card.style.transform = "";
  testimonialCarousel.classList.remove("is-dragging");
  testimonialSuppressClick = true;
  setTimeout(() => { testimonialSuppressClick = false; }, 0);
  const threshold = Math.min(110, drag.card.offsetWidth * 0.18);
  if (drag.dx < -threshold) showTestimonial(testimonialIndex + 1, { direction: 1, fling: false });
  else if (drag.dx > threshold) showTestimonial(testimonialIndex - 1, { direction: -1, fling: false });
}
testimonialDeck.addEventListener("pointerup", endTestimonialDrag);
testimonialDeck.addEventListener("pointercancel", endTestimonialDrag);

function upcomingWorkingDays() {
  const days = [];
  const day = new Date();
  day.setHours(12, 0, 0, 0);
  day.setDate(day.getDate() + 1);
  while (days.length < 3) {
    if (day.getDay() !== 0 && day.getDay() !== 6) days.push(new Date(day));
    day.setDate(day.getDate() + 1);
  }
  return days;
}

function formatSlotDate(day) {
  return new Intl.DateTimeFormat(translations[language].dateLocale, { weekday: "short", day: "numeric", month: "short" }).format(day);
}

function renderSelectedSlot() {
  const date = formatSlotDate(selectedSlot.day);
  document.getElementById("selected-slot").textContent = t("slotSelected", { date, time: selectedSlot.time });
}

function renderSlots() {
  const grid = document.getElementById("slot-grid");
  grid.replaceChildren();
  const times = [t("timeMorning"), t("timeMidday"), t("timeAfternoon")];
  upcomingWorkingDays().forEach((day) => {
    const date = formatSlotDate(day);
    times.forEach((time) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "slot-button";
      button.textContent = t("slotVisible", { date, time });
      button.setAttribute("aria-label", t("slotAria", { date, time }));
      button.addEventListener("click", () => {
        selectedSlot = { day: new Date(day), time };
        renderSelectedSlot();
        demoStep = 3;
        document.getElementById("demo-step-one").hidden = true;
        document.getElementById("demo-step-two").hidden = true;
        document.getElementById("demo-step-three").hidden = true;
        document.getElementById("demo-confirmation").hidden = false;
        document.getElementById("demo-step-indicator").textContent = t("step", { current: 3, total: 3 });
        document.querySelector("#demo-confirmation [data-close-dialog]").focus();
      });
      grid.append(button);
    });
  });
}

function renderDemoStep() {
  const finished = !document.getElementById("demo-confirmation").hidden;
  document.getElementById("demo-step-indicator").textContent = t("step", { current: demoStep, total: 3 });
  document.getElementById("demo-step-one").hidden = demoStep !== 1 || finished;
  document.getElementById("demo-step-two").hidden = demoStep !== 2 || finished;
  document.getElementById("demo-step-three").hidden = demoStep !== 3 || finished;
  if (demoStep === 3 && !finished) renderSlots();
}

productTiles.forEach((tile) => {
  // The whole card is a mouse target, except its own controls; keyboard and assistive tech use the expand button.
  tile.addEventListener("click", (event) => {
    if (!event.target.closest("[data-open-product]") && event.target.closest("a, button, input, label, [data-interactive]")) return;
    openProductDialog(tile);
  });
  tile.querySelector("[data-open-product]").addEventListener("keydown", (event) => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown"].includes(event.key)) {
      event.preventDefault();
      moveTileFocus(tile, event.key);
    }
  });
  tile.addEventListener("pointermove", (event) => {
    if (reducedMotion.matches || event.pointerType !== "mouse") return;
    const rect = tile.getBoundingClientRect();
    tile.style.setProperty("--spot-x", `${((event.clientX - rect.left) / rect.width) * 100}%`);
    tile.style.setProperty("--spot-y", `${((event.clientY - rect.top) / rect.height) * 100}%`);
  });
});

function moveTileFocus(current, direction) {
  const rect = current.getBoundingClientRect();
  const horizontal = direction === "ArrowLeft" || direction === "ArrowRight";
  const sign = direction === "ArrowRight" || direction === "ArrowDown" ? 1 : -1;
  const candidates = productTiles.filter((tile) => tile !== current).map((tile) => {
    const other = tile.getBoundingClientRect();
    const dx = other.left + other.width / 2 - (rect.left + rect.width / 2);
    const dy = other.top + other.height / 2 - (rect.top + rect.height / 2);
    const forward = sign * (horizontal ? dx : dy) > 0;
    const primary = Math.abs(horizontal ? dx : dy);
    const secondary = Math.abs(horizontal ? dy : dx);
    return { tile, forward, score: primary + secondary * 1.8 };
  });
  const directional = candidates.filter((candidate) => candidate.forward).sort((a, b) => a.score - b.score)[0];
  const fallback = (sign > 0 ? candidates : [...candidates].reverse())[0];
  (directional || fallback)?.tile.querySelector("[data-open-product]").focus();
}

const locale = () => (language === "fr" ? "fr-FR" : "en-GB");
const formatMoney = (value) => new Intl.NumberFormat(locale(), { style: "currency", currency: "EUR", maximumFractionDigits: 0 }).format(value);
const formatPercent = (value) => new Intl.NumberFormat(locale(), { style: "percent", maximumFractionDigits: 0 }).format(value / 100);

// Previews only move while on screen, in a visible tab, and when reduced motion is off.
const liveSyncers = [];
const canAnimate = (element) => element.classList.contains("is-live") && !document.hidden && !reducedMotion.matches;
const syncLive = () => liveSyncers.forEach((sync) => sync());
const liveObserver = new IntersectionObserver((entries) => {
  entries.forEach((entry) => {
    entry.target.classList.toggle("is-live", entry.isIntersecting);
    if (entry.isIntersecting) entry.target.classList.add("is-revealed");
  });
  syncLive();
}, { threshold: 0.2 });
document.addEventListener("visibilitychange", syncLive);
reducedMotion.addEventListener("change", syncLive);

function createLoop(element, step, firstDelay = 600) {
  let timer = 0;
  const run = () => {
    timer = 0;
    if (!canAnimate(element)) return;
    const delay = step();
    if (delay) timer = setTimeout(run, delay);
  };
  liveSyncers.push(() => {
    if (canAnimate(element)) {
      if (!timer) timer = setTimeout(run, firstDelay);
    } else if (timer) {
      clearTimeout(timer);
      timer = 0;
    }
  });
}

function countUp(element, target, duration) {
  const start = performance.now();
  const frame = (now) => {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - (1 - progress) ** 3;
    element.textContent = formatMoney(progress === 1 ? target : Math.round((target * eased) / 1000) * 1000);
    if (progress < 1) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

// WealthPro: tabs cycle on a progress bar; the CSS animation's end advances the tab, so hover and off-screen pause it for free.
const wpWindow = document.querySelector(".wp-window");
const wpTile = wpWindow.closest(".product-tile");
const wpTabs = [...wpWindow.querySelectorAll('[role="tab"]')];
const wpPanels = [...wpWindow.querySelectorAll('[role="tabpanel"]')];
let wpIndex = 0;
let aggregationTimers = [];

function playAggregation() {
  aggregationTimers.forEach(clearTimeout);
  aggregationTimers = [];
  const rows = [...wpWindow.querySelectorAll(".wp-row")];
  const total = wpWindow.querySelector("[data-countup]");
  if (!canAnimate(wpTile)) {
    rows.forEach((row) => { row.dataset.state = "synced"; });
    total.textContent = formatMoney(Number(total.dataset.money));
    return;
  }
  rows.forEach((row) => { row.dataset.state = "syncing"; });
  rows.forEach((row, index) => aggregationTimers.push(setTimeout(() => { row.dataset.state = "synced"; }, 650 + index * 420)));
  countUp(total, Number(total.dataset.money), 1500);
}

// Choosing a tab hands control to the visitor for good.
function stopWpCycle() {
  wpWindow.dataset.stopped = "true";
  wpWindow.classList.remove("is-cycling");
}

function showWpPanel(index, { focus = false } = {}) {
  wpIndex = (index + wpTabs.length) % wpTabs.length;
  wpTabs.forEach((tab, tabIndex) => {
    const selected = tabIndex === wpIndex;
    tab.setAttribute("aria-selected", String(selected));
    tab.tabIndex = selected ? 0 : -1;
  });
  wpPanels.forEach((panel, panelIndex) => panel.classList.toggle("is-active", panelIndex === wpIndex));
  if (focus) wpTabs[wpIndex].focus();
  if (wpIndex === 0) playAggregation();
}

wpTabs.forEach((tab, index) => {
  tab.addEventListener("click", () => {
    stopWpCycle();
    showWpPanel(index);
  });
  tab.addEventListener("keydown", (event) => {
    const moves = { ArrowRight: index + 1, ArrowLeft: index - 1, Home: 0, End: wpTabs.length - 1 };
    if (!(event.key in moves)) return;
    event.preventDefault();
    stopWpCycle();
    showWpPanel(moves[event.key], { focus: true });
  });
});
wpWindow.addEventListener("animationend", (event) => {
  if (event.animationName === "wp-progress") showWpPanel(wpIndex + 1);
});
liveSyncers.push(() => {
  wpWindow.classList.toggle("is-cycling", !reducedMotion.matches && !wpWindow.dataset.stopped);
  if (canAnimate(wpTile) && !wpTile.dataset.played) {
    wpTile.dataset.played = "true";
    if (wpIndex === 0) playAggregation();
  }
});

// Binom tile: a running meeting clock, a voice waveform, and fields picked up one by one.
const binomTile = document.querySelector(".product-tile--binom");
const binomChips = [...binomTile.querySelectorAll(".binom-chips li")];
const binomClock = document.getElementById("binom-rec-time");
let binomSeconds = 12 * 60 + 48;
let binomChipStep = binomChips.length;
document.getElementById("binom-wave").append(...Array.from({ length: 64 }, (_, index) => {
  const bar = document.createElement("i");
  const envelope = 0.45 + 0.55 * Math.sin((Math.PI * index) / 63);
  const level = 0.12 + 0.88 * envelope * Math.abs(Math.sin(index * 1.7) * Math.cos(index * 0.45));
  bar.style.setProperty("--s", level.toFixed(2));
  bar.style.setProperty("--d", `${(-((index * 0.37) % 1.1)).toFixed(2)}s`);
  return bar;
}));
createLoop(binomTile, () => {
  binomSeconds += 1;
  const minutes = Math.floor(binomSeconds / 60);
  binomClock.textContent = `00:${String(minutes).padStart(2, "0")}:${String(binomSeconds % 60).padStart(2, "0")}`;
  return 1000;
}, 1000);
createLoop(binomTile, () => {
  if (binomChipStep >= binomChips.length) {
    binomChips.forEach((chip) => chip.classList.add("is-pending"));
    binomChipStep = 0;
    return 900;
  }
  binomChips[binomChipStep].classList.remove("is-pending");
  binomChipStep += 1;
  return binomChipStep === binomChips.length ? 3800 : 1100;
}, 2400);

// WealthLab: a real, if deliberately simple, compound-growth simulation.
const labMonthly = document.getElementById("lab-monthly");
const labYears = document.getElementById("lab-years");
const labTile = labMonthly.closest(".product-tile");
const labRate = 0.03 / 12;
const supportsPathTransitions = CSS.supports("d", 'path("M0 0")');
const futureValue = (monthly, months) => (monthly * ((1 + labRate) ** months - 1)) / labRate;
// A log scale keeps small and large simulations readable on the same short chart.
const labScale = (value) => Math.log1p(value / 20000) / Math.log1p(futureValue(2000, 360) / 20000);

function setPath(id, d) {
  const path = document.getElementById(id);
  if (supportsPathTransitions) path.style.d = `path("${d}")`;
  else path.setAttribute("d", d);
}

function renderLab() {
  const monthly = Number(labMonthly.value);
  const years = Number(labYears.value);
  const total = futureValue(monthly, years * 12);
  const contributions = monthly * 12 * years;
  document.getElementById("lab-total").textContent = formatMoney(Math.round(total));
  document.getElementById("lab-contrib").textContent = formatMoney(contributions);
  document.getElementById("lab-growth").textContent = formatMoney(Math.round(total - contributions));
  document.getElementById("lab-monthly-out").textContent = formatMoney(monthly);
  document.getElementById("lab-years-out").textContent = t("labYearsValue", { n: years });
  [labMonthly, labYears].forEach((input) => {
    input.style.setProperty("--fill", `${((input.value - input.min) / (input.max - input.min)) * 100}%`);
  });
  const result = `${t("labResult")} ${formatMoney(Math.round(total))}`;
  labMonthly.setAttribute("aria-valuetext", `${formatMoney(monthly)}, ${result}`);
  labYears.setAttribute("aria-valuetext", `${t("labYearsValue", { n: years })}, ${result}`);
  // Thirty samples at any duration keep the path's command count fixed, so CSS can interpolate it.
  const y = (value) => (86 - labScale(value) * 80).toFixed(1);
  const samples = Array.from({ length: 30 }, (_, index) => {
    const months = (index / 29) * years * 12;
    return { x: ((index / 29) * 300).toFixed(1), total: y(futureValue(monthly, months)), paid: y(monthly * months) };
  });
  const line = samples.map((point, index) => `${index ? "L" : "M"}${point.x} ${point.total}`).join(" ");
  setPath("lab-line", line);
  setPath("lab-area-total", `${line} L300 90 L0 90 Z`);
  setPath("lab-area-contrib", `${samples.map((point, index) => `${index ? "L" : "M"}${point.x} ${point.paid}`).join(" ")} L300 90 L0 90 Z`);
}

[labMonthly, labYears].forEach((input) => {
  input.addEventListener("input", () => {
    labTile.dataset.touched = "true";
    renderLab();
  });
});
// Once, on first view, ease the contribution slider to hint that it can be moved.
liveSyncers.push(() => {
  if (!canAnimate(labTile) || labTile.dataset.touched || labTile.dataset.hinted) return;
  labTile.dataset.hinted = "true";
  const start = performance.now();
  const frame = (now) => {
    if (labTile.dataset.touched) return;
    const progress = Math.min((now - start) / 1100, 1);
    const eased = 1 - (1 - progress) ** 3;
    labMonthly.value = String(Math.round((250 + 250 * eased) / 50) * 50);
    renderLab();
    if (progress < 1) requestAnimationFrame(frame);
  };
  labMonthly.value = "250";
  renderLab();
  setTimeout(() => requestAnimationFrame(frame), 500);
});

// WealthTreet: the portfolio moves between its current and target allocation.
const treetWindow = document.getElementById("treet-window");
const treetTile = treetWindow.closest(".product-tile");
const treetSegments = [...treetWindow.querySelectorAll(".donut-seg")];
const treetRows = [...treetWindow.querySelectorAll(".treet-legend li")];
const treetToggle = treetWindow.querySelector(".seg");
const allocations = { current: [52, 23, 15, 10], target: [45, 30, 15, 10] };
const assetKeys = ["assetEquities", "assetBonds", "allocProperty", "assetMoney"];
let treetMode = "current";
let treetFocus = -1;

function renderTreet() {
  const values = allocations[treetMode];
  let offset = 0;
  treetSegments.forEach((segment, index) => {
    const length = Math.max(values[index] - 1.4, 0);
    segment.style.strokeDasharray = `${length} ${100 - length}`;
    segment.style.strokeDashoffset = String(-(offset + 0.7));
    segment.classList.toggle("is-focus", index === treetFocus);
    offset += values[index];
  });
  treetRows.forEach((row, index) => {
    row.querySelector("b").textContent = formatPercent(values[index]);
    const difference = allocations.target[index] - allocations.current[index];
    const delta = row.querySelector("small");
    delta.textContent = difference ? t("treetPoints", { n: `${difference > 0 ? "+" : "−"}${Math.abs(difference)}` }) : "=";
    delta.className = difference > 0 ? "is-up" : difference < 0 ? "is-down" : "";
    row.classList.toggle("is-focus", index === treetFocus);
  });
  treetWindow.classList.toggle("is-target", treetMode === "target");
  treetWindow.classList.toggle("has-focus", treetFocus >= 0);
  treetToggle.dataset.value = treetMode;
  treetToggle.querySelectorAll("button").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.alloc === treetMode)));
  document.getElementById("treet-center-value").textContent = treetFocus >= 0 ? formatPercent(values[treetFocus]) : t(treetMode === "current" ? "treetCurrent" : "treetTarget");
  document.getElementById("treet-center-label").textContent = treetFocus >= 0 ? t(assetKeys[treetFocus]) : t("treetProfile");
}

treetToggle.querySelectorAll("button").forEach((button) => {
  button.addEventListener("click", () => {
    treetTile.dataset.touched = "true";
    treetMode = button.dataset.alloc;
    renderTreet();
  });
});
const focusAsset = (index) => {
  treetFocus = index;
  renderTreet();
};
treetRows.forEach((row, index) => row.addEventListener("pointerenter", () => focusAsset(index)));
treetSegments.forEach((segment, index) => segment.addEventListener("pointerenter", () => focusAsset(index)));
treetWindow.querySelector(".treet-body").addEventListener("pointerleave", () => focusAsset(-1));
createLoop(treetTile, () => {
  if (treetTile.dataset.touched) return 0;
  if (!treetTile.matches(":hover")) {
    treetMode = treetMode === "current" ? "target" : "current";
    renderTreet();
  }
  return 3400;
}, 1600);

// WealthOne: data packets between tools, a rotating event log and a dot field that ripples out from the hub.
const oneStage = document.querySelector(".tile-stage--one");
const oneTile = oneStage.closest(".product-tile");
const oneSvg = document.getElementById("one-net-svg");
const oneLog = document.getElementById("one-log-text");
const oneLogKeys = ["oneLog1", "oneLog2", "oneLog3", "oneLog4"];
let oneLogIndex = 0;
oneSvg.pauseAnimations();
liveSyncers.push(() => {
  if (canAnimate(oneTile)) oneSvg.unpauseAnimations();
  else oneSvg.pauseAnimations();
});
createLoop(oneTile, () => {
  oneLog.classList.add("is-swapping");
  setTimeout(() => {
    oneLogIndex = (oneLogIndex + 1) % oneLogKeys.length;
    oneLog.textContent = t(oneLogKeys[oneLogIndex]);
    oneLog.classList.remove("is-swapping");
  }, 240);
  return 2600;
}, 2000);

const oneField = { canvas: document.getElementById("one-field"), dots: [], width: 0, height: 0, pointer: null, frame: 0 };
function sizeOneField() {
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const rect = oneStage.getBoundingClientRect();
  oneField.width = rect.width;
  oneField.height = rect.height;
  oneField.canvas.width = Math.round(rect.width * ratio);
  oneField.canvas.height = Math.round(rect.height * ratio);
  oneField.canvas.getContext("2d").setTransform(ratio, 0, 0, ratio, 0, 0);
  oneField.dots = [];
  const gap = 14;
  for (let y = gap / 2; y < rect.height; y += gap) {
    for (let x = gap / 2; x < rect.width; x += gap) oneField.dots.push({ x, y });
  }
}
function drawOneField(time = 0) {
  const context = oneField.canvas.getContext("2d");
  const hub = oneStage.querySelector(".one-hub").getBoundingClientRect();
  const stage = oneStage.getBoundingClientRect();
  const hubX = hub.left + hub.width / 2 - stage.left;
  const hubY = hub.top + hub.height / 2 - stage.top;
  context.clearRect(0, 0, oneField.width, oneField.height);
  context.fillStyle = "#1761f3";
  oneField.dots.forEach((dot) => {
    let { x, y } = dot;
    let lift = 0;
    if (oneField.pointer) {
      const dx = x - oneField.pointer.x;
      const dy = y - oneField.pointer.y;
      const distance = Math.hypot(dx, dy) || 1;
      if (distance < 80) {
        lift = 1 - distance / 80;
        x += (dx / distance) * lift * 9;
        y += (dy / distance) * lift * 9;
      }
    }
    const fromHub = Math.hypot(dot.x - hubX, dot.y - hubY);
    const wave = (Math.sin(fromHub / 24 - time / 520) + 1) / 2;
    context.globalAlpha = Math.min(0.08 + wave ** 4 * 0.2 + lift * 0.45, 0.7);
    context.beginPath();
    context.arc(x, y, 1 + lift * 0.7, 0, Math.PI * 2);
    context.fill();
  });
}
function runOneField(time) {
  oneField.frame = 0;
  drawOneField(time);
  if (canAnimate(oneTile)) oneField.frame = requestAnimationFrame(runOneField);
}
liveSyncers.push(() => {
  if (canAnimate(oneTile)) {
    if (!oneField.frame) oneField.frame = requestAnimationFrame(runOneField);
  } else if (oneField.frame) {
    cancelAnimationFrame(oneField.frame);
    oneField.frame = 0;
  }
});
new ResizeObserver(() => {
  sizeOneField();
  drawOneField(performance.now());
}).observe(oneStage);
oneStage.addEventListener("pointermove", (event) => {
  const rect = oneStage.getBoundingClientRect();
  oneField.pointer = { x: event.clientX - rect.left, y: event.clientY - rect.top };
  if (!canAnimate(oneTile)) drawOneField(performance.now());
});
oneStage.addEventListener("pointerleave", () => {
  oneField.pointer = null;
  if (!canAnimate(oneTile)) drawOneField(performance.now());
});

// Binom section: three steps from meeting notes to a prepared client file; fields link back to their source.
const binomSection = document.getElementById("binom");
const binomDemo = document.getElementById("binom-demo");
const binomSteps = [...binomSection.querySelectorAll(".binom-step")];

function setBinomStep(step) {
  binomDemo.dataset.step = String(step);
  binomSteps.forEach((button) => {
    if (Number(button.dataset.step) === step) button.setAttribute("aria-current", "step");
    else button.removeAttribute("aria-current");
  });
}

function playBinom() {
  if (reducedMotion.matches) {
    setBinomStep(3);
    return;
  }
  binomSection.classList.remove("is-playing");
  setBinomStep(1);
  void binomSection.offsetWidth;
  binomSection.classList.add("is-playing");
}

binomSteps.forEach((button) => {
  button.addEventListener("click", () => {
    binomSection.classList.remove("is-playing");
    setBinomStep(Number(button.dataset.step));
  });
});
binomSection.addEventListener("animationend", (event) => {
  if (event.animationName !== "binom-progress") return;
  const step = Number(binomDemo.dataset.step);
  if (step < 3) setBinomStep(step + 1);
  else binomSection.classList.remove("is-playing");
});
document.getElementById("binom-replay").addEventListener("click", playBinom);
liveSyncers.push(() => {
  if (canAnimate(binomSection) && !binomSection.dataset.played) {
    binomSection.dataset.played = "true";
    playBinom();
  }
});

function linkBinomField(field) {
  binomDemo.classList.toggle("is-linking", Boolean(field));
  binomDemo.querySelectorAll("mark, .binom-field").forEach((element) => element.classList.toggle("is-linked", element.dataset.field === field));
}
binomDemo.querySelectorAll(".binom-field").forEach((button) => {
  button.addEventListener("pointerenter", () => linkBinomField(button.dataset.field));
  button.addEventListener("pointerleave", () => linkBinomField(null));
  button.addEventListener("focus", () => linkBinomField(button.dataset.field));
  button.addEventListener("blur", () => linkBinomField(null));
  button.addEventListener("click", () => {
    if (binomDemo.dataset.step !== "3") {
      binomSection.classList.remove("is-playing");
      setBinomStep(3);
    }
    linkBinomField(button.dataset.field);
  });
});
const binomNotes = document.getElementById("binom-notes");
binomNotes.addEventListener("pointerover", (event) => linkBinomField(event.target.closest("mark")?.dataset.field ?? null));
binomNotes.addEventListener("pointerleave", () => linkBinomField(null));

function renderBinomNotes() {
  binomDemo.querySelectorAll("[data-note]").forEach((line) => {
    const source = t(line.dataset.note);
    const parts = [];
    let last = 0;
    for (const match of source.matchAll(/\[(\d):([^\]]+)\]/g)) {
      parts.push(source.slice(last, match.index));
      const mark = document.createElement("mark");
      mark.dataset.field = match[1];
      mark.style.setProperty("--n", String(Number(match[1]) - 1));
      mark.textContent = match[2];
      parts.push(mark);
      last = match.index + match[0].length;
    }
    parts.push(source.slice(last));
    line.replaceChildren(...parts);
  });
}

// WealthConnect: the client's side of the same file. Scrub the year, open what the adviser shared.
const connectPhone = document.getElementById("connect-phone");
const connectChart = document.getElementById("connect-chart");
const connectHome = document.getElementById("connect-home");
const connectDoc = document.getElementById("connect-doc");
const connectHistory = [2351000, 2362000, 2358000, 2374000, 2381000, 2376000, 2398000, 2405000, 2401000, 2422000, 2436000, 2450000];
const connectLow = Math.min(...connectHistory);
const connectHigh = Math.max(...connectHistory);
let connectScrub = null;
const connectPoint = (index) => ({ x: (index / 11) * 200, y: 54 - ((connectHistory[index] - connectLow) / (connectHigh - connectLow)) * 44 });
const monthName = (index) => new Date(2026, index, 1).toLocaleDateString(locale(), { month: "short" });

// Catmull-Rom through the monthly values, written as cubic Béziers.
const connectPoints = connectHistory.map((_, index) => connectPoint(index));
const connectCurve = connectPoints.reduce((path, point, index) => {
  if (!index) return `M${point.x} ${point.y.toFixed(1)}`;
  const before = connectPoints[index - 2] || connectPoints[index - 1];
  const start = connectPoints[index - 1];
  const after = connectPoints[index + 1] || point;
  const c1 = [start.x + (point.x - before.x) / 6, start.y + (point.y - before.y) / 6];
  const c2 = [point.x - (after.x - start.x) / 6, point.y - (after.y - start.y) / 6];
  return `${path} C${c1[0].toFixed(1)} ${c1[1].toFixed(1)} ${c2[0].toFixed(1)} ${c2[1].toFixed(1)} ${point.x.toFixed(1)} ${point.y.toFixed(1)}`;
}, "");
document.getElementById("connect-line").setAttribute("d", connectCurve);
document.getElementById("connect-area").setAttribute("d", `${connectCurve} V64 H0 Z`);

function renderConnect() {
  const index = connectScrub ?? connectHistory.length - 1;
  const value = connectHistory[index];
  const change = new Intl.NumberFormat(locale(), { style: "percent", minimumFractionDigits: 1, maximumFractionDigits: 1, signDisplay: "exceptZero" }).format(value / connectHistory[0] - 1);
  document.getElementById("connect-value").textContent = formatMoney(value);
  document.getElementById("connect-delta").textContent = connectScrub === null ? t("wpDelta") : index === 0 ? monthName(0) : t("connectSince", { pct: change, month: monthName(0) });
  const point = connectPoint(index);
  connectChart.style.setProperty("--scrub-x", `${point.x / 2}%`);
  connectChart.style.setProperty("--scrub-y", `${(point.y / 64) * 100}%`);
  connectChart.classList.toggle("is-scrubbing", connectScrub !== null);
  document.getElementById("connect-scrub-label").textContent = monthName(index);
  connectChart.setAttribute("aria-valuenow", String(index));
  connectChart.setAttribute("aria-valuetext", `${monthName(index)}, ${formatMoney(value)}`);
}
const scrubConnect = (index) => {
  connectScrub = index;
  renderConnect();
};
connectChart.addEventListener("pointermove", (event) => {
  const rect = connectChart.getBoundingClientRect();
  scrubConnect(Math.round(Math.min(Math.max((event.clientX - rect.left) / rect.width, 0), 1) * 11));
});
connectChart.addEventListener("pointerleave", () => scrubConnect(null));
connectChart.addEventListener("focus", () => scrubConnect(connectScrub ?? 11));
connectChart.addEventListener("blur", () => scrubConnect(null));
connectChart.addEventListener("keydown", (event) => {
  const current = connectScrub ?? 11;
  const moves = { ArrowLeft: current - 1, ArrowDown: current - 1, ArrowRight: current + 1, ArrowUp: current + 1, Home: 0, End: 11 };
  if (!(event.key in moves)) return;
  event.preventDefault();
  scrubConnect(Math.min(Math.max(moves[event.key], 0), 11));
});

function setConnectReading(reading) {
  connectPhone.classList.toggle("is-reading", reading);
  if (reading) connectPhone.classList.add("has-read");
  connectHome.inert = reading;
  connectDoc.inert = !reading;
  document.getElementById(reading ? "connect-back" : "connect-open").focus({ preventScroll: true });
}
document.getElementById("connect-open").addEventListener("click", () => setConnectReading(true));
document.getElementById("connect-back").addEventListener("click", () => setConnectReading(false));
document.getElementById("connect-island").addEventListener("click", () => {
  if (!connectPhone.classList.contains("has-read")) setConnectReading(true);
});

function renderProductPreviews() {
  document.querySelectorAll("[data-money]").forEach((element) => { element.textContent = formatMoney(Number(element.dataset.money)); });
  document.querySelectorAll("[data-percent]").forEach((element) => { element.textContent = formatPercent(Number(element.dataset.percent)); });
  document.getElementById("comp-count").textContent = t("compProgress", { done: 4, total: 5 });
  oneLog.textContent = t(oneLogKeys[oneLogIndex]);
  renderBinomNotes();
  renderConnect();
  renderLab();
  renderTreet();
}

const productGrid = document.getElementById("product-grid");
if (!reducedMotion.matches) productGrid.classList.add("will-reveal");
document.querySelectorAll("[data-live]").forEach((element, index) => {
  element.style.setProperty("--reveal-delay", `${(index % 3) * 90}ms`);
  liveObserver.observe(element);
});
renderIcons();

translatePage();
</script>
